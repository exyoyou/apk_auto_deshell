[project]
name = "deshell"
version = "0.1.0"
description = "Android de-shell & repack: dumped DEX -> installable, runnable unpacked APK"
requires-python = ">=3.8"

[project.scripts]
deshell-repack = "deshell.repack:main"
deshell-analyze = "deshell.analyze:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
